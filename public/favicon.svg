<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>
  <!-- Coin (bottom right) -->
  <circle cx="20" cy="20" r="7.5" fill="url(#coinGrad)" stroke="#d97706" stroke-width="0.5"/>
  <text x="20" y="21.5" text-anchor="middle" font-size="8" font-weight="bold" font-family="Arial,sans-serif" fill="#92400e">$</text>
  <!-- Chart bars (top left) -->
  <rect x="6" y="17" width="3.5" height="7" rx="0.8" fill="url(#chartGrad)" filter="url(#glow)"/>
  <rect x="10.5" y="12" width="3.5" height="12" rx="0.8" fill="url(#chartGrad)" filter="url(#glow)"/>
  <rect x="15" y="8" width="3.5" height="16" rx="0.8" fill="url(#chartGrad)" filter="url(#glow)"/>
  <!-- Arrow up on chart -->
  <path d="M15.5 9.5l2 -1.5l2 1.5" fill="none" stroke="#fde68a" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
